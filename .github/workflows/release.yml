name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release, for example v0.5.0'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  ci:
    name: Require CI for the release commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    outputs:
      run-id: ${{ steps.ci.outputs.run-id }}
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/require-full-ci.sh

  package:
    name: Package ${{ matrix.target }}
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64, linux-arm64, linux-x64, windows-x64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.ci.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            agent/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: ci-distribution
          run-id: ${{ needs.ci.outputs.run-id }}
          github-token: ${{ github.token }}
      - run: mkdir -p output && tar -xf ci-distribution.tar -C output
      - name: Package the tested frontend for this platform
        env:
          DENOVA_RELEASE_FRONTEND_DIR: ${{ github.workspace }}/output/web
          RELEASE_TARGET: ${{ matrix.target }}
        run: bash scripts/build-github-release.sh "$RELEASE_TAG" "$RELEASE_TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/github-release/denova-${{ env.RELEASE_TAG }}-${{ matrix.target }}.*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'linux-x64'
        with:
          name: release-metadata
          path: |
            dist/github-release/RELEASE_NOTES.md
            dist/github-release/install.sh

  publish:
    name: Publish verified release assets
    needs: [ci, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/github-release
      - name: Verify the complete platform set and publish
        working-directory: dist/github-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 windows-x64; do
            extension=tar.gz
            if [[ "$target" == windows-x64 ]]; then extension=zip; fi
            test -s "denova-$RELEASE_TAG-$target.$extension"
          done
          sha256sum denova-* > checksums.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Published assets are immutable: replacing them races clients that
            # already pinned this release's checksums.
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]]; then
              echo "Refusing to replace published assets; publish a new version instead." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
            gh release upload "$RELEASE_TAG" denova-* checksums.txt install.sh --clobber
          else
            gh release create "$RELEASE_TAG" --draft denova-* checksums.txt install.sh --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          # Latest only points to this version once every archive and checksum
          # has finished uploading. Interrupted uploads leave a private draft.
          gh release edit "$RELEASE_TAG" --draft=false
