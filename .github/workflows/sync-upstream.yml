name: Sync upstream and ensure image publication

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Panda-995/denova'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master
      - name: Verify synchronization and publication decisions
        run: |
          python3 .github/scripts/test_sync_upstream.py
          node --test .github/scripts/image-ci.test.mjs
      - name: Sync upstream while preserving fork workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash .github/scripts/sync-upstream.sh
      - name: Ensure source CI and image publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)" node .github/scripts/image-ci.mjs ensure
