name: Sync upstream and ensure image publication

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Panda-995/denova'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
      - name: Sync upstream while preserving fork workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash .github/scripts/sync-upstream.sh
      - name: Ensure the current commit has a published image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Token pushes do not trigger push workflows. Also retry failed builds
          # when upstream has no further commits; never cancel a running build.
          head="$(git rev-parse HEAD)"
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/docker-publish.yml/runs?head_sha=${head}&per_page=100")"
          if jq -e 'any(.workflow_runs[]; .conclusion == "success" or .status != "completed")' <<< "$runs" >/dev/null; then
            echo "Image publication already succeeded or is running for ${head}."
          else
            gh workflow run docker-publish.yml --ref master -R "$GITHUB_REPOSITORY"
            echo "Dispatched image publication for ${head}."
          fi
