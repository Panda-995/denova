name: Build and publish multi-architecture image
on:
  workflow_call:
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-publish-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Panda-995/denova' && github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Read application version
        id: version
        run: echo "value=$(jq -r .version web/package.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build complete application
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ghcr.io/panda-995/denova:${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            DENOVA_VERSION=${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=denova-${{ matrix.arch }}
          cache-to: type=gha,scope=denova-${{ matrix.arch }},mode=max
      - name: Verify startup, authentication and persistence
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.arch }}
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          umask 077
          export DENOVA_USERNAME=admin DENOVA_PASSWORD="$(openssl rand -hex 24)"
          printf 'DENOVA_USERNAME=%s\nDENOVA_PASSWORD=%s\nWEB_PORT=8082\n' "$DENOVA_USERNAME" "$DENOVA_PASSWORD" > .env
          docker compose up -d --wait --wait-timeout 240
          curl -fsS http://localhost:8082/ > /tmp/home.html
          grep -q '<html' /tmp/home.html
          # Current upstream embeds the frontend in the binary. Verify a served
          # asset instead of requiring the obsolete output/web/index.html.
          asset="$(grep -oE '/assets/[^" ]+\.js' /tmp/home.html | head -n 1)"
          test -n "$asset"
          curl -fsS "http://localhost:8082${asset}" -o /tmp/frontend.js
          test -s /tmp/frontend.js
          curl -fsS http://localhost:8082/api/auth/status | jq -e '.local == false and .authenticated == false'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8082/api/agent-chat/projects)" = 401
          jq -n '{username:env.DENOVA_USERNAME,password:env.DENOVA_PASSWORD}' > /tmp/login.json
          curl -fsS -c /tmp/cookies -H 'Content-Type: application/json' --data-binary @/tmp/login.json http://localhost:8082/api/auth/login | jq -e '.authenticated == true'
          curl -fsS -b /tmp/cookies http://localhost:8082/api/agent-chat/projects > /dev/null
          test "$(docker compose exec -T denova denova --version)" = "$EXPECTED_VERSION"
          docker compose exec -T denova rg --version
          docker compose exec -T denova chromium --version
          docker compose exec -T denova sh -c 'test -x /opt/denova/denova-updater && test -d /opt/denova/skills'
          docker compose exec -T denova sh -c 'printf persisted > /data/.denova/container-smoke'
          docker compose exec -T denova sha256sum /data/.denova/config.toml > /tmp/config-before
          docker compose restart
          docker compose up -d --wait --wait-timeout 120
          test "$(docker compose exec -T denova cat /data/.denova/container-smoke)" = persisted
          docker compose exec -T denova sha256sum /data/.denova/config.toml > /tmp/config-after
          cmp /tmp/config-before /tmp/config-after
          curl -fsS -b /tmp/cookies http://localhost:8082/api/auth/status | jq -e '.authenticated == true'
          curl -fsS -b /tmp/cookies http://localhost:8082/api/agent-chat/projects > /dev/null
      - name: Publish tested architecture
        run: docker push ghcr.io/panda-995/denova:${{ github.sha }}-${{ matrix.arch }}
      - name: Diagnostic logs
        if: failure()
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.arch }}
        run: if [ -f .env ]; then docker compose logs --tail=100; fi
      - name: Clean up runtime check
        if: always()
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.arch }}
        run: if [ -f .env ]; then docker compose down -v; fi
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify both platforms
        run: |
          # A full run may finish after another commit was pushed. Preserve the
          # immutable tags, but only promote the current default-branch tip.
          current="$(git ls-remote --exit-code origin refs/heads/master | cut -f1)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Skip latest promotion for superseded commit ${GITHUB_SHA}."
            exit 0
          fi
          image=ghcr.io/panda-995/denova
          docker buildx imagetools create -t "$image:latest" -t "$image:sha-${GITHUB_SHA::12}" \
            "$image:$GITHUB_SHA-amd64" "$image:$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$image:latest" --raw | tee /tmp/manifest.json
          jq -e '([.manifests[].platform | select(.os == "linux") | .architecture] | sort) == ["amd64","arm64"]' /tmp/manifest.json
